<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Pool — Discombobulated</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=DM+Mono:ital,wght@0,300;0,400;0,500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <style>
    /* ── TOKENS ─────────────────────────────────────────────────────── */
    :root {
      --bg:            #0D0D0D;
      --bg2:           #111111;
      --accent:        #0F7A3E;
      --accent-mid:    #138A47;
      --accent-light:  #1aac59;
      --gold:          #C9A84C;
      --gold-dim:      rgba(201,168,76,0.18);
      --gold-border:   rgba(201,168,76,0.35);
      --red:           #E53E3E;
      --red-dim:       rgba(229,62,62,0.10);
      --red-border:    rgba(229,62,62,0.25);
      --green:         #2ecc71;
      --card:          rgba(255,255,255,0.035);
      --card-hover:    rgba(255,255,255,0.06);
      --border:        rgba(255,255,255,0.08);
      --border-strong: rgba(255,255,255,0.14);
      --text:          #F0EFE9;
      --muted:         rgba(240,239,233,0.45);
      --muted2:        rgba(240,239,233,0.25);
      --sidebar-w:     248px;
    }

    /* ── RESET & BASE ───────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* noise grain overlay — canvas fills #grain div, set in JS */
    #grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9998;
      opacity: 0.055;
      background-repeat: repeat;
    }

    /* subtle vignette */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.55) 100%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── TYPOGRAPHY ─────────────────────────────────────────────────── */
    .serif   { font-family: 'Playfair Display', serif; }
    .mono    { font-family: 'DM Mono', monospace; }
    .sans    { font-family: 'DM Sans', sans-serif; }

    /* ── ANIMATION KEYFRAMES ────────────────────────────────────────── */
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-screen {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
    }
    .loading-spinner {
      width: 38px; height: 38px;
      border: 2px solid var(--border);
      border-top-color: var(--accent-light);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.95) translateY(12px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }
    @keyframes redPulse {
      0%,100% { background-color: transparent; }
      50%      { background-color: rgba(229,62,62,0.07); }
    }
    @keyframes shimmer {
      0%   { background-position: -400px 0; }
      100% { background-position: 400px 0; }
    }
    @keyframes emeraldGlow {
      0%,100% { box-shadow: 0 0 24px rgba(15,122,62,0.12); }
      50%      { box-shadow: 0 0 36px rgba(15,122,62,0.22); }
    }

    /* ── GLASS CARD ─────────────────────────────────────────────────── */
    .glass {
      background: var(--card);
      backdrop-filter: blur(14px) saturate(1.4);
      -webkit-backdrop-filter: blur(14px) saturate(1.4);
      border: 1px solid var(--border);
      border-radius: 14px;
    }
    .glass-strong {
      background: rgba(255,255,255,0.055);
      backdrop-filter: blur(20px) saturate(1.6);
      -webkit-backdrop-filter: blur(20px) saturate(1.6);
      border: 1px solid var(--border-strong);
      border-radius: 14px;
    }

    /* ── SIDEBAR ────────────────────────────────────────────────────── */
    .sidebar {
      position: fixed;
      left: 0; top: 0; bottom: 0;
      width: var(--sidebar-w);
      background: rgba(10,10,10,0.92);
      backdrop-filter: blur(24px) saturate(1.5);
      -webkit-backdrop-filter: blur(24px) saturate(1.5);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 0;
      z-index: 200;
    }

    .sidebar-logo {
      padding: 28px 22px 22px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .sidebar-logo-title {
      font-family: 'Playfair Display', serif;
      font-size: 21px;
      font-weight: 700;
      letter-spacing: -0.4px;
      color: var(--text);
    }
    .sidebar-logo-title span { color: var(--accent-light); }
    .sidebar-logo-sub {
      font-size: 11px;
      color: var(--muted);
      margin-top: 3px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .sidebar-nav {
      flex: 1;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow-y: auto;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 10px 12px;
      border-radius: 9px;
      cursor: pointer;
      color: var(--muted);
      font-size: 14px;
      font-weight: 500;
      transition: background 0.18s, color 0.18s;
      user-select: none;
      position: relative;
    }
    .nav-item:hover { background: rgba(255,255,255,0.05); color: var(--text); }
    .nav-item.active {
      background: var(--accent);
      color: #fff;
    }
    .nav-item svg { width: 17px; height: 17px; flex-shrink: 0; }

    .sidebar-bottom {
      padding: 12px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    /* ── BOTTOM NAV (mobile) ────────────────────────────────────────── */
    .bottom-nav {
      display: none;
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: rgba(10,10,10,0.96);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--border);
      z-index: 200;
      padding: 6px 0 max(6px, env(safe-area-inset-bottom));
    }
    .bottom-nav-inner {
      display: flex;
      justify-content: space-around;
    }
    .bnav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 6px 12px;
      cursor: pointer;
      color: var(--muted);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.3px;
      transition: color 0.18s;
      user-select: none;
    }
    .bnav-item.active { color: var(--accent-light); }
    .bnav-item svg { width: 21px; height: 21px; }

    /* ── MAIN CONTENT ───────────────────────────────────────────────── */
    #app { position: relative; z-index: 1; }

    .shell { display: flex; min-height: 100vh; }

    .main {
      flex: 1;
      margin-left: var(--sidebar-w);
      padding: 36px 36px 48px;
      min-height: 100vh;
    }

    /* ── LOGIN ──────────────────────────────────────────────────────── */
    .login-wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 20px 80px;
      animation: fadeIn 0.5s ease;
    }

    .login-eyebrow {
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--accent-light);
      margin-bottom: 12px;
      font-weight: 500;
    }

    .login-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(56px, 10vw, 88px);
      font-weight: 700;
      letter-spacing: -2px;
      line-height: 1;
      color: var(--text);
      text-align: center;
    }
    .login-title .accent { color: var(--accent-light); }

    .login-subtitle {
      margin-top: 14px;
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 2.5px;
      text-transform: uppercase;
      text-align: center;
    }

    .login-divider {
      width: 48px;
      height: 1px;
      background: var(--border-strong);
      margin: 36px auto;
    }

    .login-prompt {
      font-size: 13px;
      color: var(--muted);
      text-align: center;
      margin-bottom: 24px;
      letter-spacing: 0.5px;
    }

    .member-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(150px, 1fr));
      gap: 10px;
      max-width: 820px;
      width: 100%;
    }

    .member-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 11px;
      cursor: pointer;
      opacity: 0;
      animation: scaleIn 0.42s ease forwards;
      transition: border-color 0.22s, background 0.22s, transform 0.22s, box-shadow 0.22s;
    }
    .member-card:hover {
      border-color: var(--accent);
      background: rgba(15,122,62,0.10);
      transform: translateY(-4px);
      box-shadow: 0 12px 32px rgba(15,122,62,0.15);
    }

    .avatar {
      width: 46px; height: 46px;
      border-radius: 50%;
      background: linear-gradient(140deg, var(--accent) 0%, #072e1c 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      letter-spacing: -0.5px;
      flex-shrink: 0;
    }
    .avatar.sm { width: 30px; height: 30px; font-size: 11px; }
    .avatar.lg { width: 56px; height: 56px; font-size: 18px; }

    .member-card-name {
      font-size: 13px;
      font-weight: 500;
      text-align: center;
      color: var(--text);
      line-height: 1.35;
    }

    /* ── DASHBOARD ──────────────────────────────────────────────────── */
    .page-anim { animation: fadeUp 0.38s ease; }

    .dash-grid {
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    /* ── BALANCE CARD ───────────────────────────────────────────────── */
    .balance-card {
      position: relative;
      overflow: hidden;
      padding: 32px 36px;
      border-radius: 18px;
      background: rgba(255,255,255,0.035);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
    }
    /* ambient glow in top-right */
    .balance-card::before {
      content: '';
      position: absolute;
      top: -60px; right: -60px;
      width: 320px; height: 320px;
      background: radial-gradient(circle, rgba(15,122,62,0.14) 0%, transparent 70%);
      pointer-events: none;
    }
    /* subtle bottom-left accent */
    .balance-card::after {
      content: '';
      position: absolute;
      bottom: -40px; left: -40px;
      width: 200px; height: 200px;
      background: radial-gradient(circle, rgba(201,168,76,0.06) 0%, transparent 70%);
      pointer-events: none;
    }

    .balance-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 18px;
      position: relative;
      z-index: 1;
    }
    .balance-eyebrow {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 5px;
    }
    .balance-welcome {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.3px;
    }

    .tier-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 16px;
      background: var(--gold-dim);
      border: 1px solid var(--gold-border);
      border-radius: 999px;
      color: var(--gold);
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      font-family: 'DM Sans', sans-serif;
    }
    .tier-badge-emoji { font-size: 15px; }

    .balance-amount-row {
      display: flex;
      align-items: baseline;
      gap: 2px;
      margin-bottom: 18px;
      position: relative;
      z-index: 1;
    }
    .balance-sign {
      font-family: 'DM Mono', monospace;
      font-size: 30px;
      font-weight: 300;
      color: var(--muted2);
      padding-right: 2px;
    }
    .balance-num {
      font-family: 'DM Mono', monospace;
      font-size: 62px;
      font-weight: 400;
      line-height: 1;
      letter-spacing: -2px;
    }
    .balance-cents {
      font-family: 'DM Mono', monospace;
      font-size: 28px;
      font-weight: 300;
      color: var(--muted);
      margin-left: -2px;
    }
    .balance-num.pos, .text-green  { color: var(--green); }
    .balance-num.neg, .text-red    { color: var(--red); }
    .text-gold  { color: var(--gold); }
    .text-muted { color: var(--muted); }

    .balance-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      position: relative;
      z-index: 1;
    }
    .balance-meta-item {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 13px;
      color: var(--muted);
    }
    .balance-meta-item.warn { color: var(--red); }
    .balance-meta-item svg { width: 14px; height: 14px; flex-shrink: 0; }
    .balance-meta-val {
      font-family: 'DM Mono', monospace;
      color: var(--text);
      font-size: 13px;
    }

    .roast-box {
      margin-top: 18px;
      padding: 13px 18px;
      background: rgba(229,62,62,0.07);
      border: 1px solid var(--red-border);
      border-radius: 10px;
      font-size: 13px;
      font-style: italic;
      color: rgba(229,62,62,0.88);
      display: flex;
      gap: 10px;
      align-items: flex-start;
      position: relative;
      z-index: 1;
    }
    .roast-box .roast-icon { flex-shrink: 0; }

    /* ── STAT PILLS ─────────────────────────────────────────────────── */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .stat-pill {
      padding: 22px 24px;
      border-radius: 14px;
      background: var(--card);
      border: 1px solid var(--border);
      backdrop-filter: blur(12px);
      text-align: center;
      transition: border-color 0.2s, background 0.2s;
    }
    .stat-pill:hover { border-color: var(--border-strong); background: var(--card-hover); }
    .stat-pill-val {
      font-family: 'DM Mono', monospace;
      font-size: 30px;
      font-weight: 400;
      color: var(--text);
      letter-spacing: -0.5px;
      line-height: 1.1;
    }
    .stat-pill-label {
      margin-top: 6px;
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1.2px;
      font-weight: 500;
    }

    /* ── LEADERBOARD ────────────────────────────────────────────────── */
    .lb-card {
      border-radius: 16px;
      background: var(--card);
      border: 1px solid var(--border);
      backdrop-filter: blur(14px);
      overflow: hidden;
    }
    .lb-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .lb-title {
      font-family: 'Playfair Display', serif;
      font-size: 19px;
      font-weight: 600;
      letter-spacing: -0.2px;
    }
    .lb-subtitle {
      font-size: 12px;
      color: var(--muted);
    }

    .lb-scroll { overflow-x: auto; }

    table.lb-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 660px;
    }
    .lb-table th {
      padding: 11px 16px;
      text-align: left;
      font-size: 10.5px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1.1px;
      background: rgba(255,255,255,0.018);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    .lb-table td {
      padding: 13px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.035);
      vertical-align: middle;
      white-space: nowrap;
    }
    .lb-table tbody tr:last-child td { border-bottom: none; }
    .lb-table tbody tr {
      cursor: pointer;
      transition: background 0.16s;
    }
    .lb-table tbody tr:hover td { background: rgba(255,255,255,0.03); }
    .lb-table tbody tr.inactive { opacity: 0.32; }
    .lb-table tbody tr.freeloader {
      border-left: 3px solid var(--red);
      animation: redPulse 2.8s ease-in-out infinite;
    }
    .lb-table tbody tr.me td:nth-child(2) {
      /* subtle accent on current user row */
    }

    .rank-num {
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      color: var(--muted2);
      font-weight: 400;
    }

    .name-cell {
      display: flex;
      align-items: center;
      gap: 9px;
      font-weight: 500;
      font-size: 14px;
    }
    .you-badge {
      font-size: 10px;
      padding: 1px 7px;
      background: rgba(15,122,62,0.2);
      border: 1px solid rgba(15,122,62,0.4);
      border-radius: 99px;
      color: var(--accent-light);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .tier-cell-inner {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--muted);
    }

    .mono-cell {
      font-family: 'DM Mono', monospace;
      font-size: 13.5px;
    }

    .days-cell { font-family: 'DM Mono', monospace; font-size: 13px; color: var(--muted); }
    .days-cell.fire { color: var(--red); }

    .date-cell { font-size: 12px; color: var(--muted); }

    /* admin toggle */
    .eye-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      padding: 5px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      transition: color 0.16s, background 0.16s;
    }
    .eye-btn:hover { color: var(--text); background: rgba(255,255,255,0.07); }
    .eye-btn.on { color: var(--accent-light); }
    .eye-btn svg { width: 15px; height: 15px; }

    /* ── COMING SOON (unbuilt routes) ───────────────────────────────── */
    .coming-soon {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      gap: 12px;
      color: var(--muted);
      text-align: center;
    }
    .coming-soon-title {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      font-weight: 600;
      color: var(--text);
      opacity: 0.5;
    }
    .coming-soon-sub { font-size: 13px; color: var(--muted2); }

    /* ── PAGE HEADER ────────────────────────────────────────────────── */
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 28px;
      gap: 16px;
    }
    .page-title {
      font-family: 'Playfair Display', serif;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -0.5px;
      line-height: 1.1;
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      padding: 4px 0;
      background: none;
      border: none;
      transition: color 0.18s;
      margin-bottom: 4px;
    }
    .back-btn:hover { color: var(--text); }
    .back-btn svg { width: 16px; height: 16px; }

    /* ── BUTTONS ─────────────────────────────────────────────────────── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: 9px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: background 0.2s, transform 0.18s, box-shadow 0.2s;
      font-family: 'DM Sans', sans-serif;
    }
    .btn svg { width: 16px; height: 16px; flex-shrink: 0; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover {
      background: var(--accent-mid);
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(15,122,62,0.3);
    }
    .btn-sm { padding: 7px 14px; font-size: 12px; border-radius: 7px; }
    .btn-full { width: 100%; }
    .btn-ghost {
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border-strong);
      color: var(--text);
    }
    .btn-ghost:hover { background: rgba(255,255,255,0.10); }

    /* ── MODAL ───────────────────────────────────────────────────────── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.72);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      z-index: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      animation: fadeIn 0.2s ease;
    }
    .modal-card {
      background: rgba(16,16,16,0.97);
      backdrop-filter: blur(24px) saturate(1.8);

      max-width: 460px;
      padding: 32px;

      font-size: 22px;
      font-weight: 700;

      margin-bottom: 24px;
    }

      position: absolute;
      top: 18px; right: 18px;
      background: rgba(255,255,255,0.07);

      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--muted);
      transition: all 0.18s;

    .modal-close:hover { background: rgba(255,255,255,0.14); color: var(--text); }
    .modal-close svg { width: 15px; height: 15px; }

    /* ── FORM ELEMENTS ───────────────────────────────────────────────── */
    .form-group { display: flex; flex-direction: column; gap: 7px; margin-bottom: 18px; }
    .form-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .form-input, .form-select, .form-textarea {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border-strong);
      border-radius: 9px;
      padding: 11px 14px;
      color: var(--text);
      font-size: 14px;
      font-family: 'DM Sans', sans-serif;
      outline: none;
      transition: border-color 0.18s, background 0.18s;
      width: 100%;

    .form-input:focus, .form-select:focus, .form-textarea:focus {

      background: rgba(15,122,62,0.05);
    }
    .form-select {

    .amount-wrap {

      line-height: 1;

    .amount-input {
      flex: 1; background: none; border: none;
      padding: 11px 14px;
      color: var(--text);
      font-size: 15px;
      font-family: 'DM Mono', monospace;
      outline: none; width: 100%;

    /* ── CHIP GRID ───────────────────────────────────────────────────── */
    .chip-grid { display: flex; flex-wrap: wrap; gap: 7px; }
    .chip {
      padding: 5px 13px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 500;

    /* ── UPLOAD BOX ──────────────────────────────────────────────────── */
    .upload-box {

      text-align: center;
      cursor: pointer;

    }
    .upload-box:hover { border-color: var(--accent); background: rgba(15,122,62,0.04); }
    .upload-box input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%; height: 100%;
    }
    .upload-preview {
      width: 80px; height: 80px;
      border-radius: 8px;
      object-fit: cover;
      margin: 0 auto 10px;
      display: block;

    /* ── SPLIT PREVIEW ───────────────────────────────────────────────── */
    .split-preview {
      background: rgba(255,255,255,0.022);
      border: 1px solid var(--border);
      border-radius: 12px;

    }
    .split-preview-header {
      padding: 11px 16px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;

      color: var(--muted);
      border-bottom: 1px solid var(--border);

      justify-content: space-between;
      align-items: center;
    }
    .split-rows { max-height: 220px; overflow-y: auto; }
    .split-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 9px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.03);
      font-size: 13px;

    .split-row:last-child { border-bottom: none; }
    .split-name { color: var(--text); }
    .split-amount { font-family: 'DM Mono', monospace; color: var(--gold); }

    /* ── EVENT LIST ──────────────────────────────────────────────────── */
    .events-list { display: flex; flex-direction: column; gap: 11px; }
    .event-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);

    .event-name {
      font-family: 'Playfair Display', serif;
      font-size: 17px;
      font-weight: 600;

    .event-date { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
    .event-meta { display: flex; gap: 16px; flex-wrap: wrap; }
    .event-stat { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); }

    .event-chevron { color: var(--muted2); flex-shrink: 0; }

    /* ── PURCHASE CARDS ──────────────────────────────────────────────── */

      font-weight: 600;
      letter-spacing: -0.2px;

    }
    .purchase-amount {
      font-family: 'DM Mono', monospace;
      font-size: 19px;

    .purchase-meta {
      font-size: 12px;

    .purchase-delete {

      border: none;

    .purchase-delete svg { width: 15px; height: 15px; }

    /* ── FLASH MESSAGE ───────────────────────────────────────────────── */
    .flash {
      padding: 13px 18px;
      border-radius: 10px;
      background: rgba(15,122,62,0.15);
      border: 1px solid rgba(15,122,62,0.35);
      color: #4ade80;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 20px;

    .flash svg { width: 16px; height: 16px; flex-shrink: 0; }

    /* ── TAB BUTTONS ────────────────────────────────────────────────── */
    .tab-bar {
      display: flex;
      gap: 4px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 10px;

    }
    .tab-btn {
      flex: 1;
      padding: 8px 16px;

      font-weight: 600;

    .tab-btn.tab-active { background: var(--accent); color: #fff; }

    /* ── HISTORY / FLAT ROWS ─────────────────────────────────────────── */
    .history-row {

    .history-row:last-child { border-bottom: none; }
    .history-row:hover { background: rgba(255,255,255,0.025); }
    .history-row.clickable { cursor: pointer; }

    /* ── SETTLEMENT ROWS ─────────────────────────────────────────────── */
    .settle-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px 22px;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }
    .settle-party { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 120px; }
    .settle-party-name { font-weight: 600; font-size: 14px; }
    .settle-party-label { font-size: 11px; color: var(--muted); margin-top: 1px; }
    .settle-amount { font-family: 'DM Mono', monospace; font-size: 20px; color: var(--gold); flex-shrink: 0; }
    .settle-arrow { color: var(--muted2); flex-shrink: 0; }
    .settle-arrow svg { width: 20px; height: 20px; }

    /* ── PAGE VIEW-OUT TRANSITION ────────────────────────────────────── */
    @keyframes viewOut {
      from { opacity: 1; transform: translateY(0); }
      to   { opacity: 0; transform: translateY(-6px); }
    }
    .view-out { animation: viewOut 0.08s ease forwards; pointer-events: none; }

    /* ── EMPTY STATE ─────────────────────────────────────────────────── */
    .empty-state {
      padding: 56px 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .empty-state svg { opacity: 0.18; width: 44px; height: 44px; }
    .empty-state-title { font-size: 16px; font-weight: 500; color: rgba(240,239,233,0.5); }
    .empty-state-sub { font-size: 13px; color: var(--muted2); }

    /* ── RESPONSIVE ─────────────────────────────────────────────────── */
    @media (max-width: 900px) {
      .member-grid { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 768px) {
      .sidebar    { display: none; }
      .bottom-nav { display: block; }
      .main {
        margin-left: 0;
        padding: 16px 14px;
        padding-bottom: 90px;
      }
      .member-grid { grid-template-columns: repeat(3, 1fr); max-width: 480px; }
      .stats-row { grid-template-columns: 1fr 1fr; }
      .stats-row .stat-pill:last-child { grid-column: span 2; }
      .balance-num { font-size: 48px; }
      .balance-card { padding: 24px 22px; }
      .lb-table th:nth-child(n+5):not(:nth-child(6)):not(:nth-child(8)),
      .lb-table td:nth-child(n+5):not(:nth-child(6)):not(:nth-child(8)) {
        display: none;
      }
    }
    @media (max-width: 520px) {
      .member-grid { grid-template-columns: repeat(2, 1fr); }
      .stats-row { grid-template-columns: 1fr; }
      .stats-row .stat-pill:last-child { grid-column: span 1; }
    }
    @media (max-width: 380px) {
      .login-title { font-size: 48px; }
    }

    /* ── ANIMATED NAV ACTIVE ─────────────────────────────────────────── */
    @keyframes navGlow {
      0%,100% { box-shadow: 0 0 0 1px rgba(15,122,62,0.55), 0 2px 14px rgba(15,122,62,0.18); }

    .nav-item.active {
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-mid) 60%, #0e9149 100%);
      color: #fff;
      animation: navGlow 2.6s ease-in-out infinite;
    }

    /* ── TOAST ──────────────────────────────────────────────────────── */
    .toast {
      position: fixed;
      bottom: 24px; right: 24px;
      background: rgba(10,10,10,0.96);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(26,172,89,0.45);
      border-radius: 12px;
      padding: 14px 20px;
      color: #fff;
      font-size: 14px;
      font-weight: 500;
      z-index: 9100;
      display: flex;
      align-items: center;
      gap: 10px;
      animation: fadeUp 0.3s ease;

    }
    .toast svg { width: 16px; height: 16px; color: var(--accent-light); flex-shrink: 0; }
    @media (max-width: 768px) {
      .toast { bottom: 88px; right: 14px; left: 14px; max-width: none; }
    }

    /* ── FLOATING EXPORT BUTTON ─────────────────────────────────────── */
    .fab-export {
      position: fixed;
      bottom: 28px; right: 28px;
      z-index: 400;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 20px;
      background: rgba(10,10,10,0.92);
      border: 1px solid var(--border-strong);
      border-radius: 999px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(16px);
      transition: color 0.18s, border-color 0.18s, box-shadow 0.18s;
      font-family: 'DM Sans', sans-serif;
    }
    .fab-export:hover { color: var(--text); border-color: var(--accent); box-shadow: 0 4px 20px rgba(15,122,62,0.2); }
    .fab-export svg { width: 15px; height: 15px; flex-shrink: 0; }
    @media (max-width: 768px) { .fab-export { bottom: 82px; right: 14px; padding: 10px 16px; } }

    /* ── PROFILE DEBT GRID ──────────────────────────────────────────── */
    .debt-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 600px) { .debt-grid { grid-template-columns: 1fr; } }

    /* ── MOBILE PROFILE SHEET ───────────────────────────────────────── */
    .mobile-sheet-scrim {
      position: fixed; inset: 0;
      z-index: 350;
      background: rgba(0,0,0,0.45);
      animation: fadeIn 0.18s ease;
    }
    .mobile-sheet {
      position: fixed;
      bottom: calc(64px + env(safe-area-inset-bottom));
      left: 12px; right: 12px;
      background: rgba(14,14,14,0.98);
      backdrop-filter: blur(24px) saturate(1.6);
      border: 1px solid var(--border-strong);
      border-radius: 18px;
      z-index: 360;
      overflow: hidden;
      animation: scaleIn 0.2s ease;
      box-shadow: 0 24px 64px rgba(0,0,0,0.75);

    .mobile-sheet-header {
      padding: 16px 20px 14px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 12px;
    }
    .mobile-sheet-item {
      display: flex; align-items: center; gap: 13px;
      padding: 15px 20px;
      font-size: 15px; font-weight: 500;
      cursor: pointer;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      transition: background 0.15s;
      color: var(--text);

    .mobile-sheet-item:last-child { border-bottom: none; }
    .mobile-sheet-item:active { background: rgba(255,255,255,0.07); }
    .mobile-sheet-item svg { width: 18px; height: 18px; opacity: 0.7; flex-shrink: 0; }
    .mobile-sheet-item.danger { color: var(--red); }
    .mobile-sheet-item.danger svg { opacity: 1; }
